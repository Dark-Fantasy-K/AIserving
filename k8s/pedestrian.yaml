apiVersion: apps/v1
kind: Deployment
metadata:
  name: pedestrian
  labels:
    app: pedestrian
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pedestrian
  template:
    metadata:
      labels:
        app: pedestrian
    spec:
      runtimeClassName: nvidia
      containers:
        - name: pedestrian
          image: kkdocking/pedestrian-service:gpu
          imagePullPolicy: Never
          ports:
            - containerPort: 50052
          resources:
            limits:
              memory: "2Gi"
              nvidia.com/gpu: 1
              nvidia.com/gpumem: 1024
            requests:
              memory: "1Gi"
              cpu: "250m"
          readinessProbe:
            tcpSocket:
              port: 50052
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: pedestrian
spec:
  selector:
    app: pedestrian
  ports:
    - name: grpc
      port: 50052
      targetPort: 50052
  type: ClusterIP
