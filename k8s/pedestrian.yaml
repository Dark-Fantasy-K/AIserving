apiVersion: apps/v1
kind: Deployment
metadata:
  name: pedestrian
  labels:
    app: pedestrian
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pedestrian
  template:
    metadata:
      labels:
        app: pedestrian
    spec:
      containers:
        - name: pedestrian
          image: kaikanghuang/pedestrian-service:latest
          ports:
            - containerPort: 50052
          resources:
            limits:
              memory: "2Gi"
            requests:
              memory: "512Mi"
              cpu: "250m"
          readinessProbe:
            tcpSocket:
              port: 50052
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: pedestrian
spec:
  selector:
    app: pedestrian
  ports:
    - name: grpc
      port: 50052
      targetPort: 50052
  type: ClusterIP
