apiVersion: apps/v1
kind: Deployment
metadata:
  name: pedestrian
  labels:
    app: pedestrian
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pedestrian
  template:
    metadata:
      labels:
        app: pedestrian
    spec:
      containers:
        - name: pedestrian
          image: kaikanghuang/pedestrian-service:crop
          ports:
            - containerPort: 50052
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.monitoring.svc.cluster.local:4317"
            - name: OMP_NUM_THREADS
              value: "2"
            - name: MKL_NUM_THREADS
              value: "2"
          resources:
            limits:
              memory: "2Gi"
              cpu: "2"
            requests:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            tcpSocket:
              port: 50052
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: pedestrian
spec:
  selector:
    app: pedestrian
  ports:
    - name: grpc
      port: 50052
      targetPort: 50052
  type: ClusterIP
