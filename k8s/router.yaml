apiVersion: apps/v1
kind: Deployment
metadata:
  name: router
  labels:
    app: router
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: router
  template:
    metadata:
      labels:
        app: router
    spec:
      runtimeClassName: nvidia
      containers:
        - name: router
          image: kkdocking/router-service:gpu
          imagePullPolicy: Never
          ports:
            - containerPort: 50051
          env:
            - name: PEDESTRIAN_SERVICE_ADDR
              value: "pedestrian:50052"
            - name: VEHICLE_SERVICE_ADDR
              value: "vehicle:50053"
          resources:
            limits:
              memory: "2Gi"
              nvidia.com/gpu: 1
              nvidia.com/gpumem: 2048
            requests:
              memory: "1Gi"
              cpu: "250m"
              nvidia.com/gpu: 1
              nvidia.com/gpumem: 2048
          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: router
spec:
  selector:
    app: router
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
  type: ClusterIP
