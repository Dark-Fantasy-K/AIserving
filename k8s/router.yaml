apiVersion: apps/v1
kind: Deployment
metadata:
  name: router
  labels:
    app: router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: router
  template:
    metadata:
      labels:
        app: router
    spec:
      containers:
        - name: router
          image: kaikanghuang/router-service:latest
          ports:
            - containerPort: 50051
          env:
            - name: PEDESTRIAN_SERVICE_ADDR
              value: "pedestrian:50052"
            - name: VEHICLE_SERVICE_ADDR
              value: "vehicle:50053"
          resources:
            limits:
              memory: "2Gi"
            requests:
              memory: "512Mi"
              cpu: "250m"
          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: router
spec:
  selector:
    app: router
  ports:
    - port: 50051
      targetPort: 50051
  type: ClusterIP
