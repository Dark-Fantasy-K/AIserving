apiVersion: apps/v1
kind: Deployment
metadata:
  name: router
  labels:
    app: router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: router
  template:
    metadata:
      labels:
        app: router
    spec:
      containers:
        - name: router
          image: kaikanghuang/router-service:crop
          ports:
            - containerPort: 50051
          env:
            - name: PEDESTRIAN_SERVICE_ADDR
              value: "pedestrian:50052"
            - name: VEHICLE_SERVICE_ADDR
              value: "vehicle:50053"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.monitoring.svc.cluster.local:4317"
            - name: PED_CHANNELS
              value: "4"
            - name: PED_CROP_CHUNK_SIZE
              value: "8"    # k8s multi-pod: smaller chunks spread load across pods
            - name: PED_CROP_PADDING_RATIO
              value: "0.15"
          resources:
            limits:
              memory: "2Gi"
            requests:
              memory: "512Mi"
              cpu: "250m"
          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: router
spec:
  selector:
    app: router
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
  type: ClusterIP
