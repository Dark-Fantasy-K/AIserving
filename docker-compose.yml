version: "3.9"

services:
  pedestrian:
    image: kaikanghuang/pedestrian-service:latest
    container_name: pedestrian-svc
    ports:
      - "50052:50052"
    deploy:
      resources:
        limits:
          memory: 2G

  vehicle:
    image: kaikanghuang/vehicle-service:latest
    container_name: vehicle-svc
    ports:
      - "50053:50053"
    deploy:
      resources:
        limits:
          memory: 1G

  router:
    image: kaikanghuang/router-service:latest
    container_name: router-svc
    ports:
      - "50051:50051"
    environment:
      PEDESTRIAN_SERVICE_ADDR: pedestrian:50052
      VEHICLE_SERVICE_ADDR: vehicle:50053
    depends_on:
      - pedestrian
      - vehicle
    deploy:
      resources:
        limits:
          memory: 2G

  gateway:
    image: kaikanghuang/gateway:latest
    container_name: gateway-svc
    ports:
      - "5000:5000"
    environment:
      ROUTER_SERVICE_ADDR: router:50051
    depends_on:
      - router