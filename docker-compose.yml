version: "3.9"

services:
  # ── Observability ──────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: jaeger
    ports:
      - "16686:16686"   # UI
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.101.0
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"     # OTLP gRPC (services → collector)
      - "8889:8889"     # Prometheus scrape endpoint
    depends_on:
      - jaeger

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: prometheus
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:10.4.3
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
      - jaeger

  # ── Business Services ──────────────────────────────────────
  pedestrian:
    image: kaikanghuang/pedestrian-service:otel
    container_name: pedestrian-svc
    ports:
      - "50052:50052"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      - otel-collector
    deploy:
      resources:
        limits:
          memory: 2G

  vehicle:
    image: kaikanghuang/vehicle-service:otel
    container_name: vehicle-svc
    ports:
      - "50053:50053"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      - otel-collector
    deploy:
      resources:
        limits:
          memory: 1G

  router:
    image: kaikanghuang/router-service:otel
    container_name: router-svc
    ports:
      - "50051:50051"
    environment:
      PEDESTRIAN_SERVICE_ADDR: pedestrian:50052
      VEHICLE_SERVICE_ADDR: vehicle:50053
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      - pedestrian
      - vehicle
      - otel-collector
    deploy:
      resources:
        limits:
          memory: 2G

  gateway:
    image: kaikanghuang/gateway:otel
    container_name: gateway-svc
    ports:
      - "5000:5000"
    environment:
      ROUTER_SERVICE_ADDR: router:50051
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      - router
      - otel-collector
